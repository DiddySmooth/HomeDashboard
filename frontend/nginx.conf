server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service.
    #
    # Use Docker's embedded DNS resolver (127.0.0.11) plus a variable upstream so
    # nginx resolves the "backend" hostname lazily at request time instead of at
    # startup. A bare `proxy_pass http://backend:8000` is resolved once when nginx
    # boots and aborts with "host not found in upstream" if the backend container
    # isn't resolvable yet (or is restarted later).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
